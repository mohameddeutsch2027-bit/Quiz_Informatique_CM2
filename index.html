<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Quiz Informatique</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;800&family=DM+Mono:wght@400;500&family=ADLaM+Display&family=Fredoka:wght@600&display=swap">
<style>
/* Layout: one question at a time on a Seyès-ruled page (school exercise book), forward-only navigation */
:root {
  --paper: #19191d;
  --ink: #f1f1f4;
  --muted: #a9a9b6;
  --rule: #2c2c33;
  --margin: #ff7a45;
  --accent: #8fb4ff;
  --accent-ink: #14151a;
  --go1: #7a1fd6;
  --go2: #d11a8f;
  --card: #26272d;
  --border: #414144;
  --soft: #31323a;
  --bad: #ff7b72;
  --good: #4ade80;
  --qcolor: #8fb4ff;
  --label: #ff8fc8;
  --t-red: #ff5a4d;
  --t-green: #3ddc84;
  --clock: #3be07a;
  --clock-ink: #5ff29a;
  --bg1: #19191d;
  --bg2: #1c1c21;
  --bg3: #19191d;
  --on-bg: #f1f1f4;
  --on-bg-soft: #b9b9c6;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
:root[data-theme="dark"] {
  --paper: #150b2e; --ink: #f1e9ff; --muted: #b9a8e0; --rule: #2a1a52; --margin: #ffd400;
  --accent: #c9a0ff; --accent-ink: #1a0b3a; --go1: #c9a0ff; --go2: #ff9ad5;
  --card: #1f1240; --border: #3d2a74; --soft: #2a1a58;
  --bad: #ff8a80; --good: #6fd6a0; --qcolor: #9db4ff; --label: #ff9ad5; --t-red: #ff6b6b; --t-green: #4ade80; --clock: #3be07a; --clock-ink: #5ff29a;
  --bg1: #1b0a45; --bg2: #5a0f6e; --bg3: #b04a12; --on-bg: #ffffff; --on-bg-soft: rgba(255,255,255,.9);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background-color: var(--bg1);
  background-image:
    linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px),
    linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
  background-size: 100% 28px, 112px 100%, 100% 100%;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100vh;
}
.wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 20px; }

header { display: grid; gap: 4px; padding-left: 14px; border-left: 3px solid var(--margin); text-align: center; }
.kicker { font-family: var(--font-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 { color: var(--on-bg); font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 5.5vw, 38px); line-height: 1.1; margin: 0; text-wrap: balance; }
h1.t-red { color: var(--t-red); }
h1.t-green { color: var(--t-green); }
.level { justify-self: center; font-family: var(--font-display); font-weight: 800; font-size: 18px; letter-spacing: .04em; color: #ffffff; background: linear-gradient(135deg, #1f78e8 0%, #1a2fc4 100%); padding: 4px 18px; border-radius: 999px; margin-top: 4px; }
.who { font-size: 15px; color: var(--on-bg-soft); font-weight: 700; }

.progress { display: grid; gap: 8px; margin-bottom: 20px; }
.progress-row { display: flex; justify-content: space-between; gap: 12px; font-family: var(--font-mono); font-size: 13px; color: var(--on-bg); font-weight: 500; font-variant-numeric: tabular-nums; }
.bar { height: 10px; border-radius: 5px; background: rgba(255,255,255,.08); border: 1px solid #414144; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--go1), var(--go2)); transition: width .25s ease; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.45); padding: 24px; display: grid; gap: 18px; min-width: 0; }
.art { justify-self: center; width: min(230px, 75%); height: auto; }
.tag { justify-self: start; font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); background: var(--soft); padding: 4px 10px; border-radius: 4px; }
.q { text-align: center; color: var(--qcolor); font-family: "ADLaM Display", var(--font-display); font-weight: 400; font-size: clamp(21px, 4.2vw, 26px); line-height: 1.25; margin: 0; text-wrap: balance; outline: none; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.clockbox { display: flex; align-items: center; gap: 10px; }
.tnum { font-family: var(--font-mono); font-weight: 500; font-size: 24px; font-variant-numeric: tabular-nums; color: var(--clock-ink); min-width: 3.2ch; text-align: right; }
.clock { display: block; line-height: 0; }
.clock svg { display: block; width: 84px; height: 84px; }
.clock .face { fill: var(--soft); stroke: var(--ink); stroke-width: 3; }
.clock .ticks line { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
.clock .arc { stroke: var(--clock); stroke-linecap: butt; }
.clock .track { stroke: var(--clock); opacity: .18; }
.clock .hand { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
.clock .pin { fill: var(--ink); }
.clockbox.low .arc { stroke: var(--bad); }
.clockbox.low .tnum { color: var(--bad); }
.foot.split { justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
button.ghost { font: inherit; font-weight: 700; background: transparent; color: var(--accent); border: 1.5px solid var(--border); border-radius: 8px; padding: 11px 18px; cursor: pointer; }
button.ghost:hover { border-color: var(--accent); }
button.ghost:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.pic { background: #ffffff; padding: 6px; justify-self: center; width: auto; max-width: 100%; max-height: 180px; border-radius: 14px; }
p.hint, p.hint b, p.hint span { color: #ffe14d; font-weight: 800; font-size: 17px; opacity: 1; }
.hint { text-align: center; margin: -8px 0 0; color: var(--muted); font-size: 15px; }
.lead { margin: 0; color: var(--muted); }

.field { display: grid; gap: 6px; }
.field label { font-family: "Fredoka", var(--font-display); font-weight: 600; font-size: 21px; color: var(--label); }
.field input { font: inherit; color: var(--ink); background: var(--paper); border: 1.5px solid var(--border); border-radius: 8px; padding: 12px 14px; width: 100%; min-width: 0; }
.field input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.names { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.err { margin: 0; color: var(--bad); font-size: 15px; min-height: 1.4em; }

.explorer { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--paper); font-size: 14px; }
.explorer .titlebar { background: var(--accent); color: var(--accent-ink); padding: 6px 12px; font-weight: 700; font-size: 13px; }
.explorer .addr { padding: 6px 12px; border-bottom: 1px solid var(--border); font-family: var(--font-mono); font-size: 12px; color: var(--muted); overflow-x: auto; white-space: nowrap; }
.explorer .tbl { overflow-x: auto; }
.explorer table { border-collapse: collapse; width: 100%; min-width: 420px; }
.explorer th { text-align: left; font-weight: 700; color: var(--muted); padding: 6px 12px; border-bottom: 1px solid var(--border); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
.explorer td { padding: 6px 12px; border-bottom: 1px solid var(--rule); }
.explorer td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

.options { display: grid; gap: 10px; margin: 0; padding: 0; border: 0; min-width: 0; }
.options.row { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }
.opt { position: relative; display: flex; align-items: center; gap: 12px; padding: 13px 16px; border: 1.5px solid var(--border); border-radius: 8px; cursor: pointer; background: var(--card); min-width: 0; transition: border-color .12s, background .12s; }
.opt:hover { border-color: #38bdf8; }
.opt input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.mark { flex: none; width: 20px; height: 20px; border: 2px solid var(--muted); border-radius: 50%; display: grid; place-items: center; }
.multi .mark { border-radius: 4px; }
.mark::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent-ink); transform: scale(0); transition: transform .12s; }
.multi .mark::after { border-radius: 2px; }
.opt.on { border-color: #38bdf8; background: rgba(56,189,248,.22); box-shadow: 0 0 0 1px #38bdf8; }
.opt.on .txt { color: #ffffff; font-weight: 700; }
.opt.on .mark { background: #38bdf8; border-color: #38bdf8; }
.opt.on .mark::after { transform: scale(1); background: #0b1220; }
.opt:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
.opt .txt { overflow-wrap: anywhere; }
.symbol .txt { font-family: var(--font-mono); font-size: 22px; font-weight: 500; }
.symbol .opt { justify-content: center; }

.foot { display: flex; justify-content: flex-end; }
button.go { font: inherit; font-weight: 700; background: linear-gradient(135deg, #e63a06 0%, #81280e 100%); color: #ffffff; border: 0; border-radius: 8px; padding: 12px 24px; cursor: pointer; }
button.go.blue { background: linear-gradient(135deg, #e63a06 0%, #81280e 100%); color: #ffffff; }
button.go:disabled { opacity: .45; cursor: not-allowed; }
button.go:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

.result { gap: 20px; }
.result .top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.emoji { font-size: clamp(56px, 14vw, 84px); line-height: 1; }
.rname { font-family: var(--font-display); font-weight: 800; font-size: clamp(22px, 5vw, 30px); line-height: 1.15; margin: 0; overflow-wrap: anywhere; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { border: 1.5px solid var(--border); border-radius: 8px; padding: 14px 16px; display: grid; gap: 2px; background: var(--paper); }
.stat span { font-size: 13px; color: var(--muted); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .05em; }
.stat b { font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat.good b { color: var(--good); }
.stat.bad b { color: var(--bad); }
.stat.final { border-color: var(--accent); background: var(--soft); }
.stat.final small { font-size: .5em; color: var(--muted); font-weight: 600; }
.result p { margin: 0; }
.revtitle { font-family: var(--font-display); font-weight: 800; font-size: 22px; margin: 4px 0 0; }
.rev { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.rev li { border: 1.5px solid var(--border); border-left-width: 6px; border-radius: 8px; padding: 12px 14px; background: var(--paper); display: grid; gap: 6px; min-width: 0; }
.rev li.ok { border-left-color: var(--good); }
.rev li.ko { border-left-color: var(--bad); }
.rev .rq { font-weight: 700; overflow-wrap: anywhere; }
.rev .line { display: flex; gap: 10px; align-items: baseline; overflow-wrap: anywhere; min-width: 0; }
.rev .lab { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); flex: none; min-width: 108px; }
.rev .good { color: var(--good); font-weight: 700; }
.rev .bad { color: var(--bad); font-weight: 700; }

@media (max-width: 480px) {
  .card { padding: 18px; }
  body { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
